name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  openzeppelin-current:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgepillar/zvm-zns
          ref: 44360c841df4b22a1b8e71c33e90d271014d8171
          path: .ci-contract-controls
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /contracts/scripts/compiler-input.mjs
            /contracts/test/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Observe the selected toolchain
        run: |
          node --version
          node -e "if (typeof require('node:module').registerHooks !== 'function') process.exit(1)"
          npm --version
          python3 --version
      - name: Qualify the tracked patched source and exact generated outputs
        run: python3 -B tools/dependency-review/openzeppelin_current.py --controls .ci-contract-controls --output "$RUNNER_TEMP/zns-openzeppelin-current"
      - name: Retain bounded qualification evidence without profile trees
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openzeppelin-current-qualification
          path: |
            ${{ runner.temp }}/zns-openzeppelin-current/source-binding.json
            ${{ runner.temp }}/zns-openzeppelin-current/report.json
            ${{ runner.temp }}/zns-openzeppelin-current/streams/*.txt
          if-no-files-found: error
          retention-days: 14

  lock-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Observe the selected source and Python runtime
        run: |
          git rev-parse --verify HEAD
          python3 --version
      - name: Check declaration-graph data controls
        run: python3 -B -m unittest discover -s tools/dependency-review -p 'test_*.py' -v
      - name: Fetch the exact locked bundled publication with a transport cap
        run: |
          archive="$RUNNER_TEMP/oxide-wasm32-wasi-4.3.3.tgz"
          test ! -e "$archive"
          curl --fail --silent --show-error --retry 0 --max-time 90 --max-filesize 33554432 --proto '=https' --output "$archive" https://registry.npmjs.org/@tailwindcss/oxide-wasm32-wasi/-/oxide-wasm32-wasi-4.3.3.tgz
      - name: Inventory current locks, bundled members and original notices
        run: python3 -B tools/dependency-review/application_lock_review.py --archive "$RUNNER_TEMP/oxide-wasm32-wasi-4.3.3.tgz"

  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the verifier with declared archive fixtures
        env:
          ZNS_VENDOR_TEST_TMPDIR: ${{ runner.temp }}
        run: node --test contracts/scripts/verify-vendor.test.mjs
      - name: Fetch the reviewed ENS publication with a transport cap
        run: |
          archive="$RUNNER_TEMP/ens-contracts-1.7.0.tgz"
          test ! -e "$archive"
          curl --fail --silent --show-error --retry 0 --max-time 90 --max-filesize 33554432 --output "$archive" https://registry.npmjs.org/@ensdomains/ens-contracts/-/ens-contracts-1.7.0.tgz
      - name: Compare the actual publication without extracting it
        run: node contracts/scripts/verify-vendor.mjs --archive "$RUNNER_TEMP/ens-contracts-1.7.0.tgz"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      vite-artifact-id: ${{ steps.vite-artifact.outputs.artifact-id }}
      vite-artifact-digest: ${{ steps.vite-artifact.outputs.artifact-digest }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - id: application-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
      - id: node-toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check out separate Vite 8 build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-vite-upgrade
          submodules: true
          persist-credentials: false
      - id: vite-builds
        name: Review the Vite 8 archive, lock and both application builds
        working-directory: .ci-vite-upgrade
        shell: bash
        run: python3 -B tools/dependency-review/vite_upgrade.py --output "$RUNNER_TEMP/zns-vite-upgrade" | tee -a "$GITHUB_STEP_SUMMARY"
      # Preserve baseline browser evidence if the candidate build fails.
      - name: Qualify application dependencies and both browser scenarios
        if: ${{ !cancelled() && steps.application-source.outcome == 'success' && steps.node-toolchain.outcome == 'success' }}
        env:
          VITE_BUILDS_OUTCOME: ${{ steps.vite-builds.outcome }}
        shell: bash
        run: |
          args=(--output "$RUNNER_TEMP/zns-app")
          if [[ "$VITE_BUILDS_OUTCOME" == success ]]; then
            args+=(--vite-upgrade "$RUNNER_TEMP/zns-vite-upgrade")
          fi
          (set -o noclobber; cat .env.example > .env)
          python3 -B tools/dependency-review/application_runtime.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded application qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-patch-qualification
          path: |
            ${{ runner.temp }}/zns-app/source-binding.json
            ${{ runner.temp }}/zns-app/report.json
            ${{ runner.temp }}/zns-app/streams/*.txt
            ${{ runner.temp }}/zns-app/application-raw-profile-sources.json
            ${{ runner.temp }}/zns-app/application-profile-source-binding.json
            ${{ runner.temp }}/zns-app/browser-evidence/*.png
            ${{ runner.temp }}/zns-app/browser-evidence/browser-progress.json
          if-no-files-found: error
          retention-days: 14
      - id: vite-artifact
        name: Retain the candidate locks and bounded build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-upgrade-qualification
          path: |
            ${{ runner.temp }}/zns-vite-upgrade/report.json
            ${{ runner.temp }}/zns-vite-upgrade/candidate-package.json
            ${{ runner.temp }}/zns-vite-upgrade/*-lock.json
            ${{ runner.temp }}/zns-vite-upgrade/vite-compiled-labels.json
            ${{ runner.temp }}/zns-vite-upgrade/vite-distribution-evidence.json
            ${{ runner.temp }}/zns-vite-upgrade/streams/*.txt
          if-no-files-found: error
          retention-days: 14

  vite-evidence:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.vite-artifact-id }}
          path: ${{ runner.temp }}/zns-vite-review
          skip-decompress: true
          digest-mismatch: error
      - name: Replay the exact candidate lock and archive evidence
        env:
          VITE_ARTIFACT_ID: ${{ needs.web.outputs.vite-artifact-id }}
          VITE_ARTIFACT_DIGEST: ${{ needs.web.outputs.vite-artifact-digest }}
        shell: bash
        run: python3 -B tools/dependency-review/vite_evidence.py --download "$RUNNER_TEMP/zns-vite-review" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the independent replay result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-evidence-replay
          path: ${{ runner.temp }}/zns-vite-review-result.json
          if-no-files-found: error
          retention-days: 14
