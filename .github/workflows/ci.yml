name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            contracts/test/package-lock.json
      - run: npm ci --ignore-scripts --prefix contracts/test
      - run: npm --prefix contracts run test:isolated
      - run: npm ci --ignore-scripts --prefix contracts
      - run: npm --prefix contracts run build
      - run: git diff --exit-code -- contracts/out web/src/abi.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Check shipped endpoint and heartbeat context controls without network
        run: npm run test:context
      # The build refuses to run without its endpoints; the example has them.
      - run: cp ../.env.example ../.env
      - run: npm run build
